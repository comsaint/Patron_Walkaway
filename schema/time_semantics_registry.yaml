# Time Semantics Registry (v2 — gaming_day_event migration)
#
# Purpose:
#   Defines table-specific event-time and observed-time semantics for source
#   tables admitted into the layered data asset pipeline.
#
# Notes:
#   - All timestamp columns are normalized to Asia/Hong_Kong tz-aware in L0 cleansing.
#   - DATE columns are not timezone-converted; ``gaming_day_event`` is derived from event time.
#   - Hard-fail when ``__etl_insert_Dtm < event_time`` (``>=`` is valid).

registry_version: "v2"
owner: "data-assets"
default_timezone: "Asia/Hong_Kong"
default_observed_at_col: "__etl_insert_Dtm"

global_policy:
  timezone_mode: "hk_tz_aware"
  day_column: "gaming_day_event"
  day_derivation: "CAST(timezone('Asia/Hong_Kong', event_time) AS DATE)"
  etl_sanity_rule: "observed_at >= event_time"
  etl_sanity_hard_fail: true
  idempotent_timezone_conversion: true

tables:
  t_bet:
    description: "Player bet event table; primary source for bet/run/trip event sequences."
    business_key:
      - "bet_id"
    event_time_col: "payout_complete_dtm"
    observed_at_col: "__etl_insert_Dtm"
    update_time_col: null
    partition_cols:
      - "gaming_day_event"
    timestamp_columns_all:
      - "payout_complete_dtm"
      - "__etl_insert_Dtm"
    null_event_time_policy: "drop_row"
    dedup_rule_id: "preprocess_bet_v1"
    preprocessing_contract:
      - "Require valid player_id before L1 materialization; exclude placeholder player_id = -1."
      - "Require valid bet_id before L1 materialization."
      - "Drop rows with NULL payout_complete_dtm."
      - "Derive gaming_day_event from payout_complete_dtm in Asia/Hong_Kong."
      - "Hard-fail when __etl_insert_Dtm < payout_complete_dtm."
      - "Exclude bets whose player_id is in the FND-12 dummy set produced by preprocess_session_v1."
      - "Exclude unrated/non-rated player_id values using the canonical mapping eligibility sidecar."
      - "Resolve duplicated bet_id versions before run/trip assignment."
    correction_expected: false
    late_arrival_expected: true
    late_threshold: "122 sec (ingest_delay_cap_sec / residual P95 after bulk exclusions)"
    contributes_to_trip_close_horizon: true
    notes:
      - "gaming_day (raw business column) is not used; gaming_day_event replaces all day semantics."

  t_session:
    description: "Player session table; auxiliary context and identity/profile input."
    business_key:
      - "session_id"
    event_time_col: "session_end_dtm"
    observed_at_col: "__etl_insert_Dtm"
    update_time_col: "lud_dtm"
    partition_cols:
      - "gaming_day_event"
    timestamp_columns_all:
      - "session_start_dtm"
      - "session_end_dtm"
      - "lud_dtm"
      - "__etl_insert_Dtm"
    null_event_time_policy: "ignore_row"
    dedup_rule_id: "preprocess_session_v1"
    preprocessing_contract:
      - "Exclude rows with NULL session_end_dtm (no session_start_dtm fallback)."
      - "Derive gaming_day_event from session_end_dtm in Asia/Hong_Kong."
      - "Hard-fail when __etl_insert_Dtm < session_end_dtm on retained rows."
      - "Deduplicate session_id versions preferring latest lud_dtm."
    correction_expected: true
    late_arrival_expected: true
    late_threshold: "636 sec (residual P95 after bulk exclusions)"
    contributes_to_trip_close_horizon: false
    notes:
      - "Rows with NULL session_end_dtm are excluded from asset-layer preprocessing."

  t_game:
    description: "Game/hand table; optional future context source."
    business_key:
      - "game_id"
    event_time_col: "payout_complete_dtm"
    observed_at_col: "__etl_insert_Dtm"
    update_time_col: "__ts_ms"
    partition_cols:
      - "gaming_day_event"
    dedup_rule_id: "preprocess_game_v1"
    correction_expected: true
    late_arrival_expected: true
    late_threshold: "TBD"
    contributes_to_trip_close_horizon: false

  t_shoe:
    description: "Shoe lifecycle table; deferred."
    business_key:
      - "shoe_id"
    event_time_col: "shoe_end_dtm"
    observed_at_col: "__etl_insert_Dtm"
    update_time_col: "__ts_ms"
    partition_cols: []
    dedup_rule_id: "preprocess_shoe_v1"
    correction_expected: "TBD"
    late_arrival_expected: "TBD"
    late_threshold: "TBD"
    contributes_to_trip_close_horizon: false
