# ----------------------------------------------------------------------------
# PR-A3: chunk-dependent replacements (1:1 near-equivalents, not exact)
#
# Source: trainer/feature_spec/chunk_dependent_high_risk_features.md
# Risk classes:
#   A - ROWS UNBOUNDED PRECEDING
#   B - ROWS k PRECEDING
#   D - derived from A/B (transitive risk)
# Acceptance per Phase A plan:
#   - PIT must hold (no future leakage)
#   - semantic direction kept (not value parity)
#   - replacements use new layered naming
# ----------------------------------------------------------------------------

chunk_dependent_replacements:

  - old_feature_id: cum_bets
    risk_class: A
    replacement_feature_id: run__bets_cnt__currentrun
    layer: run
    rationale: >
      Replace global running count with current-run running count. Run boundary is
      well-defined (RUN_BREAK_MIN gap) and resets cleanly at run start, eliminating
      the chunk-position dependency that made cum_bets non-PIT-safe in chunked load.
    expected_difference: >
      Bounded per-run instead of unbounded per-canonical_id; magnitude smaller and
      stationary across runs.

  - old_feature_id: cum_wager
    risk_class: A
    replacement_feature_id: run__wager_sum__currentrun
    layer: run
    rationale: >
      Same as cum_bets: scope to the current open run instead of unbounded history.
    expected_difference: >
      Bounded per-run; resets at each run boundary.

  - old_feature_id: avg_wager_sofar
    risk_class: D
    replacement_feature_id: run__wager_avg__currentrun
    layer: run
    rationale: >
      Replacement = run__wager_sum__currentrun / run__bets_cnt__currentrun.
      Avoids inheriting cum_* chunk dependency. Same intent (running mean of wager).
    expected_difference: >
      Reset per run; less smoothing than session-wide average but PIT-safe.

  - old_feature_id: bets_cnt_w20
    risk_class: B
    replacement_feature_id: bet__bets_cnt__w15m
    layer: bet
    rationale: >
      Replace ROWS-based 20-bet event window with an existing time-based 15m window.
      Time-based windows do not depend on chunk position and remain PIT-safe.
    expected_difference: >
      Time- vs event-count-based; numerical scale differs but pace signal preserved.

  - old_feature_id: back_bet_cnt_w20
    risk_class: B
    replacement_feature_id: bet__back_bet_cnt__w15m
    layer: bet
    rationale: >
      Same as bets_cnt_w20: switch to time window. New feature_id introduced via
      Phase B authoring; semantic = SUM(is_back_bet) over a 15-minute time window.
    expected_difference: >
      Magnitude varies with event density rather than pure event count.

  - old_feature_id: back_bet_pct_w20
    risk_class: D
    replacement_feature_id: bet__back_bet_pct__w15m
    layer: bet
    rationale: >
      Numerator/denominator both move to time-window equivalents (back_bet_cnt /
      bets_cnt over w15m), eliminating chunk-B inheritance.
    expected_difference: >
      Should track pre-existing pct closely; minor distribution shift on bursts.

  - old_feature_id: wager_slope_w10bets
    risk_class: B
    replacement_feature_id: bet__wager_slope__w15m
    layer: bet
    rationale: >
      Replace LAG(wager, 10) ROWS-based slope with a time-window slope: change in
      wager mean from w15m to w5m (sign carries direction). Time-window form is
      PIT-safe in chunked loads.
    expected_difference: >
      Different numeric scale (per-minute proxy vs per-10-bet); direction preserved.

  - old_feature_id: wager_recent_vs_session_avg
    risk_class: D
    replacement_feature_id: bet__wager_avg_w15m_over_run_avg__currentrun
    layer: bet
    rationale: >
      Replace ratio of recent vs session-cumulative average with ratio of recent
      vs current-run average. Run-level mean is bounded per-run and PIT-safe.
    expected_difference: >
      Smaller denominator per run; ratio more reactive to run-onset behavior.
