# Track-to-Layer migration mapping (Phase A deliverable)
#
# Authoritative mapping from legacy 3-track feature_id to the new
# bet / run / trip / player layered framework introduced by `layered_framework`
# in trainer/feature_spec/feature_candidates.yaml (dev); runtime uses bundle feature_spec.yaml.
#
# Status values:
#   mapped     - new_feature_id replaces old_feature_id at the same semantic level
#   deprecated - old_feature_id is dropped; a near-equivalent replacement is listed
#                under chunk_dependent_replacements (PR-A3) where applicable
#   removed    - old_feature_id is dropped without replacement (drop-only)
#
# Naming convention enforced here:
#   <layer>__<semantic>__<scope>
#   layer  in {bet, run, trip, player}
#   scope  examples:
#     time window:  wXm, wXh, wXd        (e.g. w5m, w15m, w30d)
#     event window: lastNruns, lastNtrips, lastNbets, lastNgames
#     open entity:  currentrun, currenttrip
#   Do not combine sofar/so_far with currentrun/currenttrip in one feature_id (redundant).
#   No-scope features omit the trailing "__<scope>" segment.
#
# Phase A only governs the mapping. Spec sections track_llm/track_human/track_profile
# remain authoritative for the loader until later phases (B onward).

mapping_version: "0.1"
phase: "phase_a"
status: "draft"
related_specs:
  - trainer/feature_spec/feature_candidates.yaml
  - models/feature_spec.yaml
related_docs:
  - trainer/feature_spec/chunk_dependent_high_risk_features.md
  - .cursor/plans/layered_fe_refactor_plan_25f31e45.plan.md
  - .cursor/plans/phase_a_working_plan_a3a4e84d.plan.md

