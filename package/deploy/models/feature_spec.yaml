version: "2.0"
spec_id: "walkaway_features_v2_template"
description: "Template feature spec for Patron Walkaway Predictor (bet/run/trip/player layered methods)."

# ---------------------------------------------------------------------------
# Layered framework — contract authority (layer-only sections).
# ---------------------------------------------------------------------------
layered_framework:
  status: "phase_a_skeleton"
  authoritative: true
  notes: >
    Layered semantics are authoritative for naming, PIT, and layer ownership.
    Legacy track_* sections are removed; this spec is layer/method only.

  layers:
    bet:
      grain: "one row per bet"
      key: "bet_id"
      foreign_keys: ["canonical_id"]
      cutoff_rule: "cutoff_time = bet event time"
      pit_rule: "observed_time <= cutoff_time"
    run:
      grain: "one row per closed run; last-style features look at runs strictly before cutoff"
      key: "run_id"
      foreign_keys: ["canonical_id"]
      cutoff_rule: "cutoff_time inherited from bet"
      pit_rule: "observed_time <= cutoff_time"
    trip:
      grain: "one row per closed trip; aggregated from runs"
      key: "trip_id"
      foreign_keys: ["canonical_id"]
      cutoff_rule: "cutoff_time inherited from bet"
      pit_rule: "observed_time <= cutoff_time"
    player:
      grain: "as-of snapshot per canonical_id"
      key: "canonical_id"
      cutoff_rule: "snapshot_time <= cutoff_time"
      pit_rule: "no future leakage allowed"

  naming_convention:
    pattern: "<layer>__<semantic>__<scope>"
    layer_values: ["bet", "run", "trip", "player"]
    scope_examples:
      # Bet/run/trip dynamics use event windows (currentrun, lastNbets); player snapshot may use w7d/w30d.
      time_window: ["w7d", "w30d", "w90d", "w180d"]
      event_window:
        last_closed_only: ["last1run", "last3runs", "last3trips", "last20bets"]
        current_open_only: ["currentrun", "currenttrip"]
    semantic_rules:
      - "Use 'last*' only for closed entities (no leakage)."
      - "Use 'current*' only for the open / in-progress entity."
      - "Do not combine sofar/so_far with currentrun/currenttrip in one feature_id (redundant)."
      - "Display alias may use hyphens; feature_id uses [a-z0-9_] only."

  cutoff_contract:
    mode: "single_global_cutoff"
    bet_level_cutoff: "bet event time (payout_complete_dtm in current schema)"
    rationale: "bet-level prediction; trainer/scorer/backtester/validator share the same cutoff_time."

  admission_rule:
    on_pit_unavailable: "prediction_skip"
    skip_reason_codes:
      - "PIT_UNAVAILABLE_SOURCE"
      - "IDENTITY_UNMATCHED"
      - "MISSING_REQUIRED_INPUT"

  reason_code_policy:
    direction: "remove"
    notes: >
      Phase A only flags the direction. Existing reason_code_category fields remain
      so the current loader is not broken; downstream removal happens in later phases.

  legacy_tracks:
    status: "removed"

  # PR-A3 chunk-risk near-equivalents (was standalone mapping YAML). Loader: get_chunk_replacements().
  chunk_dependent_replacements:
    - old_feature_id: cum_bets
      risk_class: A
      replacement_feature_id: run__bets_cnt__currentrun
      layer: run
      rationale: >
        Replace global running count with current-run running count. Run boundary is
        well-defined (RUN_BREAK_MIN gap) and resets cleanly at run start, eliminating
        the chunk-position dependency that made cum_bets non-PIT-safe in chunked load.
      expected_difference: >
        Bounded per-run instead of unbounded per-canonical_id; magnitude smaller and
        stationary across runs.

    - old_feature_id: cum_wager
      risk_class: A
      replacement_feature_id: run__wager_sum__currentrun
      layer: run
      rationale: >
        Same as cum_bets: scope to the current open run instead of unbounded history.
      expected_difference: >
        Bounded per-run; resets at each run boundary.

    - old_feature_id: avg_wager_sofar
      risk_class: D
      replacement_feature_id: run__wager_avg__currentrun
      layer: run
      rationale: >
        Replacement = run__wager_sum__currentrun / run__bets_cnt__currentrun.
        Avoids inheriting cum_* chunk dependency. Same intent (running mean of wager).
      expected_difference: >
        Reset per run; less smoothing than session-wide average but PIT-safe.

    - old_feature_id: bets_cnt_w20
      risk_class: B
      replacement_feature_id: bets_in_run_so_far
      layer: run
      rationale: >
        GitHub #34: minute windows removed; use current-run bet count (bounded,
        PIT-safe) instead of ROWS-20 when a coarser density signal is acceptable.
      expected_difference: >
        Run-scoped count resets at RUN_BREAK_MIN; not equivalent to last-20-bets globally.

    - old_feature_id: back_bet_cnt_w20
      risk_class: B
      replacement_feature_id: back_bet_cnt_w20
      layer: bet
      rationale: >
        ROWS-20 back bet count retained in catalog (event window, not clock window).
      expected_difference: >
        Unchanged semantics when the ROWS window remains in the frozen bundle.

    - old_feature_id: back_bet_pct_w20
      risk_class: D
      replacement_feature_id: back_bet_pct_w20
      layer: bet
      rationale: >
        Derived from ROWS-20 numerator/denominator; still valid under #34.
      expected_difference: >
        Unchanged when bundle keeps last-20-bets definitions.

    - old_feature_id: wager_slope_w10bets
      risk_class: B
      replacement_feature_id: wager_slope_w10bets
      layer: bet
      rationale: >
        GitHub #34: same feature_id; expression now partitions by (canonical_id, run_id).
      expected_difference: >
        Slope is within-run instead of spanning run boundaries.

    - old_feature_id: wager_recent_vs_session_avg
      risk_class: D
      replacement_feature_id: wager_vs_run_avg_ratio
      layer: bet
      rationale: >
        GitHub #34: ratio of current wager to run mean (no cum_* / session average).
      expected_difference: >
        Resets each run; more local than lifetime session average.

tracks_enabled:
  # Unified pipeline: player_run_asset replaces legacy CSV player_snapshot/track_profile bundle.
  player_run_asset: true
  bet_duckdb_window: true
  run_state_machine: true
  trip_asset_materialized: true

execution:
  engine: "duckdb"
  time_column: "payout_complete_dtm"
  partition_key: "canonical_id"
  order_by: "payout_complete_dtm ASC, bet_id ASC"
  timezone_policy: "hk_local_tz_naive"

inference_state:
  history_window_min: 20          # >= bet_duckdb_window.guardrails.max_window_minutes + buffer (no minute RANGE windows)
  history_buffer_min: 15
  cold_start_backfill: true
  cold_start_suspend_alerts: true

guardrails:
  disallow_sql_keywords_in_expressions: ["SELECT", "FROM", "JOIN", "UNION", "WITH"]
  allowed_aggregate_functions: ["COUNT", "SUM", "AVG", "MIN", "MAX", "STDDEV_SAMP"]
  allowed_window_functions: ["LAG"]
  allowed_scalar_functions: ["EPOCH", "OVER", "LEAST", "GREATEST"]
  bet_duckdb_window_allowed_columns:
    - bet_id
    - canonical_id
    - payout_complete_dtm
    - wager
    - payout_odds
    - base_ha
    - status
    - is_back_bet
    - position_idx
    - table_id
    - game_id

bet_duckdb_window:
  name: "Track LLM"
  source_table: "t_bet"
  data_scope: "bet_only"
  enabled: true

  guardrails:
    max_window_minutes: 0
    disallow_following: true

  candidates:
    # ==== 節奏 / 頻率 (Pace) — run-scoped; requires run_state_machine columns on bets_df ====
    - feature_id: "pace_drop_ratio"
      target_layer: bet
      type: "derived"
      dtype: "float"
      description: "當前 run 下注節奏 proxy（bets/min 正規化至 0–1，無分鐘窗）"
      rationale: "以同一 run 內累計筆數 / 經過分鐘近似節奏；取代舊 w5m/w30m 比值。"
      expression: "LEAST(CAST(bets_in_run_so_far AS DOUBLE) / NULLIF(GREATEST(minutes_since_run_start, 0.0166667), 0) / 30.0, 1.0)"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0.0, max: 1.0 }
      reason_code_category: "BETTING_PACE_DROPPING"

    - feature_id: "prev_bet_gap_min"
      target_layer: bet
      type: "derived"
      dtype: "float"
      description: "與上一筆下注間隔（分鐘）"
      rationale: "文獻 inter-bet interval 拉長為離場前兆；可單獨或與節奏特徵搭配。"
      expression: "(epoch(payout_complete_dtm) - epoch(LAG(payout_complete_dtm, 1) OVER (PARTITION BY canonical_id ORDER BY payout_complete_dtm ASC, bet_id ASC))) / 60.0"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0.0, max: 10080.0 }
      reason_code_category: "BETTING_PACE_DROPPING"

    # ==== 金額動態 (Wager) — run-scoped ====
    - feature_id: "wager_avg_currentrun"
      target_layer: bet
      type: "derived"
      dtype: "float"
      description: "當前 run 內平均注碼（累計/筆數）"
      rationale: "取代舊 w15m 平均；與 run 邊界一致。"
      expression: "CAST(wager_sum_in_run_so_far AS DOUBLE) / NULLIF(CAST(bets_in_run_so_far AS DOUBLE), 0)"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0.0, max: 500000000.0 }
      reason_code_category: "LOW_ACTIVITY_RECENTLY"

    - feature_id: "wager_avg_tail5_in_run"
      target_layer: bet
      type: "window"
      dtype: "float"
      description: "當前 run 內最近 5 筆平均注碼"
      expression: "AVG(wager)"
      window_partition_by: ["canonical_id", "run_id"]
      window_frame: "ROWS BETWEEN 4 PRECEDING AND CURRENT ROW"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0.0, max: 500000000.0 }
      reason_code_category: "LOW_ACTIVITY_RECENTLY"

    - feature_id: "wager_tail5_over_run_avg"
      target_layer: bet
      type: "derived"
      dtype: "float"
      description: "最近 5 筆均注 / 當前 run 均注（<1 代表注碼收縮）"
      depends_on: ["wager_avg_tail5_in_run"]
      expression: "CAST(wager_avg_tail5_in_run AS DOUBLE) / NULLIF(CAST(wager_sum_in_run_so_far AS DOUBLE) / NULLIF(CAST(bets_in_run_so_far AS DOUBLE), 0), 0)"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0.0, max: 10.0 }
      reason_code_category: "LOW_ACTIVITY_RECENTLY"

    - feature_id: "wager_slope_w10bets"
      target_layer: bet
      type: "derived"
      dtype: "float"
      description: "最近 10 筆注碼趨勢斜率（負值代表減碼；限當前 run）"
      rationale: "以近 10 筆 wager 變化率近似注碼方向性。"
      expression: "(CAST(wager AS DOUBLE) - CAST(LAG(wager, 10) OVER (PARTITION BY canonical_id, run_id ORDER BY payout_complete_dtm ASC, bet_id ASC) AS DOUBLE)) / 10.0"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: -500000000.0, max: 500000000.0 }
      reason_code_category: "LOW_ACTIVITY_RECENTLY"

    - feature_id: "wager_std_currentrun"
      target_layer: bet
      type: "window"
      dtype: "float"
      description: "當前 run 內注碼樣本標準差（累計視窗）"
      rationale: "取代舊 w15m 標準差；與 run 邊界一致。"
      expression: "STDDEV_SAMP(wager)"
      window_partition_by: ["canonical_id", "run_id"]
      window_frame: "ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0.0, max: 1000000000.0 }
      reason_code_category: "LOW_ACTIVITY_RECENTLY"

    - feature_id: "wager_vs_run_avg_ratio"
      target_layer: bet
      type: "derived"
      dtype: "float"
      description: "當筆注碼 / 當前 run 內平均注碼"
      rationale: "取代 wager_recent_vs_session_avg；避免跨 chunk 的 cum 平均。"
      expression: "CAST(wager AS DOUBLE) / NULLIF(CAST(wager_sum_in_run_so_far AS DOUBLE) / NULLIF(CAST(bets_in_run_so_far AS DOUBLE), 0), 0)"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0.0, max: 10.0 }
      reason_code_category: "LOW_ACTIVITY_RECENTLY"

    - feature_id: "wager_max_currentrun"
      target_layer: bet
      type: "window"
      dtype: "float"
      description: "當前 run 內至今最大單筆注碼"
      expression: "MAX(wager)"
      window_partition_by: ["canonical_id", "run_id"]
      window_frame: "ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0.0, max: 500000000.0 }
      reason_code_category: "LOW_ACTIVITY_RECENTLY"

    - feature_id: "prev_wager"
      target_layer: bet
      type: "lag"
      dtype: "float"
      description: "上一筆下注注碼"
      expression: "LAG(wager, 1)"
      postprocess:
        fill: { strategy: "zero" }

    # ==== 勝負結果 (Outcome) — cumulative within current run ====
    - feature_id: "lose_cnt_currentrun"
      target_layer: bet
      type: "window"
      dtype: "int"
      description: "當前 run 內累計輸局次數"
      rationale: "取代舊 w15m 累計；與 run 邊界一致。"
      expression: "SUM(CASE WHEN status = 'LOSE' THEN 1 ELSE 0 END)"
      window_partition_by: ["canonical_id", "run_id"]
      window_frame: "ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0, max: 10000 }
      reason_code_category: "LOSS_STREAK"

    - feature_id: "win_cnt_currentrun"
      target_layer: bet
      type: "window"
      dtype: "int"
      description: "當前 run 內累計贏局次數"
      expression: "SUM(CASE WHEN status = 'WIN' THEN 1 ELSE 0 END)"
      window_partition_by: ["canonical_id", "run_id"]
      window_frame: "ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0, max: 10000 }
      reason_code_category: "WIN_COUNT"

    - feature_id: "push_cnt_currentrun"
      target_layer: bet
      type: "window"
      dtype: "int"
      description: "當前 run 內累計 PUSH 次數"
      expression: "SUM(CASE WHEN status = 'PUSH' THEN 1 ELSE 0 END)"
      window_partition_by: ["canonical_id", "run_id"]
      window_frame: "ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0, max: 10000 }
      reason_code_category: "LOSS_STREAK"

    - feature_id: "win_rate_currentrun"
      target_layer: bet
      type: "derived"
      dtype: "float"
      description: "當前 run 內勝率（累計）"
      depends_on: ["win_cnt_currentrun"]
      expression: "CAST(win_cnt_currentrun AS DOUBLE) / NULLIF(CAST(bets_in_run_so_far AS DOUBLE), 0)"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0.0, max: 1.0 }
      reason_code_category: "WIN_RATE"

    - feature_id: "non_win_rate_currentrun"
      target_layer: bet
      type: "derived"
      dtype: "float"
      description: "當前 run 內非 WIN 率（LOSE+PUSH）"
      depends_on: ["lose_cnt_currentrun", "push_cnt_currentrun"]
      expression: "CAST((lose_cnt_currentrun + push_cnt_currentrun) AS DOUBLE) / NULLIF(CAST(bets_in_run_so_far AS DOUBLE), 0)"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0.0, max: 1.0 }
      reason_code_category: "LOSS_STREAK"

    - feature_id: "prev_status"
      target_layer: bet
      type: "lag"
      dtype: "str"
      screening_eligible: false
      description: "上一把結果狀態（WIN/LOSE/PUSH/…）"
      rationale: "上一把輸贏常是行為轉折與離場觸發事件。"
      expression: "LAG(status, 1)"

    - feature_id: "prev_bet_was_loss"
      target_layer: bet
      type: "derived"
      dtype: "int"
      screening_eligible: false
      description: "上一把是否輸錢 (1=是 0=否)"
      rationale: "即時損失為離場觸發事件。"
      depends_on: ["prev_status"]
      expression: "CASE WHEN prev_status = 'LOSE' THEN 1 ELSE 0 END"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0, max: 1 }
      reason_code_category: "LOSS_STREAK"

    # ==== 風險偏好 (Risk) ====
    - feature_id: "avg_payout_odds_currentrun"
      target_layer: bet
      type: "window"
      dtype: "float"
      description: "當前 run 內平均賠率（累計視窗）"
      rationale: "取代舊 w15m 平均；與 run 邊界一致。"
      expression: "AVG(payout_odds)"
      window_partition_by: ["canonical_id", "run_id"]
      window_frame: "ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0.0, max: 1000000.0 }
      reason_code_category: "RISK_APPETITE"

    - feature_id: "back_bet_cnt_w20"
      target_layer: bet
      type: "window"
      dtype: "int"
      description: "近 20 把中 back bet 次數"
      rationale: "投注類型轉變反映心態變化；供 back_bet_pct_w20 計算比例。"
      expression: "SUM(is_back_bet)"
      window_frame: "ROWS BETWEEN 20 PRECEDING AND CURRENT ROW"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0, max: 1000000 }
      reason_code_category: "RISK_APPETITE"

    - feature_id: "bets_cnt_w20"
      target_layer: bet
      type: "window"
      dtype: "int"
      screening_eligible: false
      description: "近 20 把下注次數"
      rationale: "供 back_bet_pct_w20 計算比例。"
      expression: "COUNT(*)"
      window_frame: "ROWS BETWEEN 20 PRECEDING AND CURRENT ROW"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0, max: 1000000 }
      reason_code_category: "BETTING_PACE_DROPPING"

    - feature_id: "back_bet_pct_w20"
      target_layer: bet
      type: "derived"
      dtype: "float"
      description: "近 20 把中 back bet 佔比 (%)"
      rationale: "投注類型轉變反映心態變化。"
      depends_on: ["back_bet_cnt_w20", "bets_cnt_w20"]
      expression: "100.0 * CAST(back_bet_cnt_w20 AS DOUBLE) / NULLIF(bets_cnt_w20, 0)"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0.0, max: 100.0 }
      reason_code_category: "RISK_APPETITE"

    # ==== 時段 / 位置 (Context) ====
    - feature_id: "hour_of_day"
      target_layer: bet
      type: "derived"
      dtype: "int"
      description: "下注發生的小時（0–23）"
      expression: "date_part('hour', payout_complete_dtm)"
      postprocess:
        fill: { strategy: "zero" }

    - feature_id: "position_min_currentrun"
      target_layer: bet
      type: "window"
      dtype: "int"
      screening_eligible: false
      description: "當前 run 內最小 position_idx（累計視窗）"
      expression: "MIN(position_idx)"
      window_partition_by: ["canonical_id", "run_id"]
      window_frame: "ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0, max: 1000 }
      reason_code_category: "ENGAGEMENT"

    - feature_id: "position_max_currentrun"
      target_layer: bet
      type: "window"
      dtype: "int"
      screening_eligible: false
      description: "當前 run 內最大 position_idx（累計視窗）"
      expression: "MAX(position_idx)"
      window_partition_by: ["canonical_id", "run_id"]
      window_frame: "ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0, max: 1000 }
      reason_code_category: "ENGAGEMENT"

    - feature_id: "position_moved_currentrun"
      target_layer: bet
      type: "derived"
      dtype: "int"
      description: "當前 run 內是否曾換位 (1=是 0=否)"
      depends_on: ["position_min_currentrun", "position_max_currentrun"]
      expression: "CASE WHEN position_min_currentrun = position_max_currentrun THEN 0 ELSE 1 END"
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0, max: 1 }
      reason_code_category: "ENGAGEMENT"

    # ==== Legacy (passthrough + canonical_id window/derived) ====
    - feature_id: "wager"
      target_layer: bet
      type: "passthrough"
      dtype: "float"
      description: "當筆下注金額（raw）"
    - feature_id: "payout_odds"
      target_layer: bet
      type: "passthrough"
      dtype: "float"
      description: "賠率（raw）"
    - feature_id: "base_ha"
      target_layer: bet
      type: "passthrough"
      dtype: "float"
      description: "莊家優勢（raw）"
    - feature_id: "is_back_bet"
      target_layer: bet
      type: "passthrough"
      dtype: "float"
      description: "是否 back bet（raw）"
    - feature_id: "position_idx"
      target_layer: bet
      type: "passthrough"
      dtype: "float"
      description: "桌位序號（raw）"
    - feature_id: "time_of_day_sin"
      target_layer: bet
      type: "derived"
      dtype: "float"
      description: "一天內分鐘數的 sin 編碼（0–1440）"
      expression: "sin(2 * pi() * (date_part('hour', payout_complete_dtm) * 60 + date_part('minute', payout_complete_dtm)) / 1440)"
      postprocess:
        fill: { strategy: "zero" }
    - feature_id: "time_of_day_cos"
      target_layer: bet
      type: "derived"
      dtype: "float"
      description: "一天內分鐘數的 cos 編碼（0–1440）"
      expression: "cos(2 * pi() * (date_part('hour', payout_complete_dtm) * 60 + date_part('minute', payout_complete_dtm)) / 1440)"
      postprocess:
        fill: { strategy: "zero" }

  active:
    feature_ids: []   # 由訓練流程產生的生產特徵清單寫入

run_state_machine:
  name: "Track Human"
  enabled: true

  candidates:
    - feature_id: "loss_streak"
      target_layer: bet
      type: "python_vectorized"
      dtype: "int"
      description: "連輸計數（WIN 重置；PUSH 是否重置由 config 決定）"
      function_name: "compute_loss_streak_features"
      input_columns: ["canonical_id", "payout_complete_dtm", "bet_id", "status"]
      output_columns: ["loss_streak"]
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0, max: 999 }
      reason_code_category: "LOSS_STREAK"

    - feature_id: "consecutive_non_win_cnt"
      target_layer: bet
      type: "python_vectorized"
      dtype: "int"
      description: "從最近一次 WIN 到現在，連續非 WIN（LOSE+PUSH）筆數"
      function_name: "compute_consecutive_non_win_features"
      input_columns: ["canonical_id", "payout_complete_dtm", "bet_id", "status"]
      output_columns: ["consecutive_non_win_cnt"]
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0, max: 999 }
      reason_code_category: "LOSS_STREAK"

    - feature_id: "minutes_since_run_start"
      target_layer: run
      type: "python_vectorized"
      dtype: "float"
      description: "距離 run 起點的分鐘數（run 以 gap>=RUN_BREAK_MIN 切分）"
      function_name: "compute_run_boundary_features"
      input_columns: ["canonical_id", "payout_complete_dtm", "bet_id", "wager", "casino_win"]
      output_columns: ["run_id", "minutes_since_run_start", "bets_in_run_so_far", "wager_sum_in_run_so_far", "net_win_in_run_so_far", "net_win_per_bet_in_run"]
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0.0, max: 1000000.0 }

    - feature_id: "bets_in_run_so_far"
      target_layer: run
      type: "python_vectorized"
      dtype: "int"
      description: "當筆為止同一 run 內下注筆數（1-based）"
      function_name: "compute_run_boundary_features"
      input_columns: ["canonical_id", "payout_complete_dtm", "bet_id", "wager", "casino_win"]
      output_columns: ["run_id", "minutes_since_run_start", "bets_in_run_so_far", "wager_sum_in_run_so_far", "net_win_in_run_so_far", "net_win_per_bet_in_run"]
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0, max: 10000000 }

    - feature_id: "wager_sum_in_run_so_far"
      target_layer: run
      type: "python_vectorized"
      dtype: "float"
      description: "當筆為止同一 run 內下注金額累計"
      function_name: "compute_run_boundary_features"
      input_columns: ["canonical_id", "payout_complete_dtm", "bet_id", "wager", "casino_win"]
      output_columns: ["run_id", "minutes_since_run_start", "bets_in_run_so_far", "wager_sum_in_run_so_far", "net_win_in_run_so_far", "net_win_per_bet_in_run"]
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0.0, max: 1000000000000.0 }

    - feature_id: "net_win_in_run_so_far"
      target_layer: run
      type: "python_vectorized"
      dtype: "float"
      description: "當筆為止同一 run 內玩家淨損益累計（player_net_win=-casino_win）"
      function_name: "compute_run_boundary_features"
      input_columns: ["canonical_id", "payout_complete_dtm", "bet_id", "wager", "casino_win"]
      output_columns: ["run_id", "minutes_since_run_start", "bets_in_run_so_far", "wager_sum_in_run_so_far", "net_win_in_run_so_far", "net_win_per_bet_in_run"]
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: -1000000000000.0, max: 1000000000000.0 }
      reason_code_category: "LOSS_STREAK"

    - feature_id: "net_win_per_bet_in_run"
      target_layer: run
      type: "python_vectorized"
      dtype: "float"
      description: "當前 run 每注平均淨損益（run 內累計淨損益/下注筆數）"
      function_name: "compute_run_boundary_features"
      input_columns: ["canonical_id", "payout_complete_dtm", "bet_id", "wager", "casino_win"]
      output_columns: ["run_id", "minutes_since_run_start", "bets_in_run_so_far", "wager_sum_in_run_so_far", "net_win_in_run_so_far", "net_win_per_bet_in_run"]
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: -1000000000.0, max: 1000000000.0 }
      reason_code_category: "LOSS_STREAK"

    - feature_id: "table_hc"
      target_layer: bet
      type: "python_vectorized"
      dtype: "int"
      description: "同一 table_id 滾動視窗內不重複玩家數（head count；S1）"
      function_name: "compute_table_hc_features"
      input_columns: ["table_id", "bet_id", "payout_complete_dtm", "player_id"]
      output_columns: ["table_hc"]
      postprocess:
        fill: { strategy: "zero" }
        clip: { min: 0, max: 10000 }
      screening_eligible: true
      reason_code_category: "ENGAGEMENT"

    - feature_id: "run_duration_vs_personal_avg"
      target_layer: run
      type: "python_vectorized"
      dtype: "float"
      description: "當前 run 時長相對個人 30 天平均 session 時長"
      function_name: "compute_wave2_personalized_features"
      input_columns:
        [
          "minutes_since_run_start",
          "bets_in_run_so_far",
          "player_run_avg_duration_min_30d",
          "player_run_num_bets_sum_30d",
          "player_run_count_30d",
        ]
      output_columns: ["run_duration_vs_personal_avg", "bets_in_run_vs_personal_avg", "pace_vs_personal_baseline"]
      screening_eligible: true
      reason_code_category: "BETTING_PACE_DROPPING"

    - feature_id: "bets_in_run_vs_personal_avg"
      target_layer: run
      type: "python_vectorized"
      dtype: "float"
      description: "當前 run 下注筆數相對個人 30 天平均每次 session 筆數"
      function_name: "compute_wave2_personalized_features"
      input_columns:
        [
          "minutes_since_run_start",
          "bets_in_run_so_far",
          "player_run_avg_duration_min_30d",
          "player_run_num_bets_sum_30d",
          "player_run_count_30d",
        ]
      output_columns: ["run_duration_vs_personal_avg", "bets_in_run_vs_personal_avg", "pace_vs_personal_baseline"]
      screening_eligible: true
      reason_code_category: "BETTING_PACE_DROPPING"

    - feature_id: "pace_vs_personal_baseline"
      target_layer: bet
      type: "python_vectorized"
      dtype: "float"
      description: "當前 run 下注頻率（bets/min）相對個人 30 天基準頻率"
      function_name: "compute_wave2_personalized_features"
      input_columns:
        [
          "minutes_since_run_start",
          "bets_in_run_so_far",
          "player_run_avg_duration_min_30d",
          "player_run_num_bets_sum_30d",
          "player_run_count_30d",
        ]
      output_columns: ["run_duration_vs_personal_avg", "bets_in_run_vs_personal_avg", "pace_vs_personal_baseline"]
      screening_eligible: true
      reason_code_category: "BETTING_PACE_DROPPING"

  active:
    feature_ids: []

